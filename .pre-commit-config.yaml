repos:
  # ── Higiene geral ─────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # ── Detecção de segredos — Yelp detect-secrets ────────────────────────────
  # Escaneia todo arquivo staged em busca de padrões de chaves e tokens.
  # Usa uma baseline (.secrets.baseline) para ignorar falsos positivos
  # já auditados pela equipe.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # ── Detecção de segredos — gitleaks ──────────────────────────────────────
  # Segunda camada: regex específicos de provedores (AWS, GCP, Datadog, etc.)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]
